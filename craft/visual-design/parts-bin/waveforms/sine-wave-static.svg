<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sine wave, one full cycle, static. Electric Ink parts bin.
  A true sine (sampled every 6 degrees), not a curve that only looks like
  one. One cycle spans 360 units, so x in units equals the angle in
  degrees. Zero line at y = 40, peak 30 units above and below it.

  Color by what the wave is: voltage violet #b48cff (the default here) or
  current cyan #39d7ff. Never a decorative color. Two waves on one figure
  (voltage and current) keep their own colors and get a word label each.

  Line: 3 units. In a 360 unit wide figure shown full width on a phone
  that is about 3 px, above the 1.5 px floor for a line that carries
  meaning. The zero line is the leader gray #8b95a7, dashed.

  For a wave that moves or answers a slider, use the generator in
  sine-wave-path-generator.md next to this file.
  Restyle from the page with the classes pb-wave and pb-axis.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80" role="img" aria-label="One cycle of a sine wave">
  <line class="pb-axis" x1="0" y1="40" x2="360" y2="40" stroke="#8b95a7" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path class="pb-wave" fill="none" stroke="#b48cff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M 0 40.0 L 6 36.9 L 12 33.8 L 18 30.7 L 24 27.8 L 30 25.0 L 36 22.4 L 42 19.9 L 48 17.7 L 54 15.7 L 60 14.0 L 66 12.6 L 72 11.5 L 78 10.7 L 84 10.2 L 90 10.0 L 96 10.2 L 102 10.7 L 108 11.5 L 114 12.6 L 120 14.0 L 126 15.7 L 132 17.7 L 138 19.9 L 144 22.4 L 150 25.0 L 156 27.8 L 162 30.7 L 168 33.8 L 174 36.9 L 180 40.0 L 186 43.1 L 192 46.2 L 198 49.3 L 204 52.2 L 210 55.0 L 216 57.6 L 222 60.1 L 228 62.3 L 234 64.3 L 240 66.0 L 246 67.4 L 252 68.5 L 258 69.3 L 264 69.8 L 270 70.0 L 276 69.8 L 282 69.3 L 288 68.5 L 294 67.4 L 300 66.0 L 306 64.3 L 312 62.3 L 318 60.1 L 324 57.6 L 330 55.0 L 336 52.2 L 342 49.3 L 348 46.2 L 354 43.1 L 360 40.0"/>
</svg>
